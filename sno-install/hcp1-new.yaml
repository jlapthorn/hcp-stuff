apiVersion: v1
kind: Namespace
metadata:
  name: clusters
spec: {}
status: {}
---
apiVersion: hypershift.openshift.io/v1beta1
kind: HostedCluster
metadata:
  name: hcp1
  namespace: clusters
spec:
  autoscaling: {}
  capabilities: {}
  configuration: {}
  controllerAvailabilityPolicy: SingleReplica
  dns:
    baseDomain: lapthorn.me
  etcd:
    managed:
      storage:
        persistentVolume:
          size: 8Gi
          storageClassName: lvms-vg1
        type: PersistentVolume
    managementType: Managed
  fips: false
  infraID: hcp1-9krmw
  networking:
    clusterNetwork:
    - cidr: 10.132.0.0/14
    networkType: OVNKubernetes
    serviceNetwork:
    - cidr: 172.31.0.0/16
  olmCatalogPlacement: management
  platform:
    kubevirt: {}
    type: KubeVirt
  pullSecret:
    name: hcp1-pull-secret
  release:
    image: quay.io/openshift-release-dev/ocp-release:4.22.14-x86_64
  secretEncryption:
    aescbc:
      activeKey:
        name: hcp1-etcd-encryption-key
    type: aescbc
  services:
  - service: APIServer
    servicePublishingStrategy:
      type: LoadBalancer
  - service: OAuthServer
    servicePublishingStrategy:
      type: Route
      route:
        hostname: oauth-openshift.hosted.hcp1.lapthorn.me
  - service: Konnectivity
    servicePublishingStrategy:
      type: Route
      route:
        hostname: konnectivity.hosted.hcp1.lapthorn.me
  - service: Ignition
    servicePublishingStrategy:
      type: Route
      route:
        hostname: ignition.hosted.hcp1.lapthorn.me
  sshKey: {}
status:
  controlPlaneEndpoint:
    host: ""
    port: 0
---
apiVersion: hypershift.openshift.io/v1beta1
kind: NodePool
metadata:
  name: hcp1
  namespace: clusters
spec:
  arch: amd64
  clusterName: hcp1
  management:
    autoRepair: false
    upgradeType: Replace
  nodeDrainTimeout: 0s
  nodeVolumeDetachTimeout: 0s
  platform:
    kubevirt:
      additionalNetworks:
      - name: localnet-100
      attachDefaultNetwork: false
      compute:
        cores: 2
        memory: 8Gi
      networkInterfaceMultiqueue: Enable
      rootVolume:
        persistent:
          accessModes:
          - ReadWriteOnce
          size: 40Gi
          storageClass: lvms-vg1
        type: Persistent
    type: KubeVirt
  release:
    image: quay.io/openshift-release-dev/ocp-release:4.22.14-x86_64
  replicas: 0
status:
  replicas: 0
---
